name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NovaGamepad-Day2-layout-fix.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          unzip -o NovaGamepad-Day2-layout-fix.zip -d project

      - name: Find Gradle project
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)")
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Patch source for build
        run: |
          MAIN="$PROJECT_DIR/app/src/main/java/com/novagamepad/app/MainActivity.kt"

          sed -i 's/BEHAVIOR_SHOW_TRANSIENT_BY_SWIPE_GESTURE/BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE/g' "$MAIN"

          cat > "$PROJECT_DIR/app/src/main/res/values/themes.xml" <<'THEME'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.NovaGamepad">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          THEME

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Check APK
        run: |
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaGamepad-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
