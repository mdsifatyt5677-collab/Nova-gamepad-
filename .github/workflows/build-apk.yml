name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NovaGamepad-Day5-assets.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          unzip -o NovaGamepad-Day5-assets.zip -d project

      - name: Find Gradle project
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix Android source and version
        run: |
          MAIN="$PROJECT_DIR/app/src/main/java/com/novagamepad/app/MainActivity.kt"
          BUILD="$PROJECT_DIR/app/build.gradle.kts"

          sed -i \
            's/BEHAVIOR_SHOW_TRANSIENT_BY_SWIPE_GESTURE/BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE/g' \
            "$MAIN"

          sed -i \
            's/versionCode = [0-9]*/versionCode = 2/' \
            "$BUILD"

          sed -i \
            's/versionName = "[^"]*"/versionName = "0.2.0-day5"/' \
            "$BUILD"

      - name: Create valid Android theme
        run: |
          cat > "$PROJECT_DIR/app/src/main/res/values/themes.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.NovaGamepad"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:windowBackground">
                      @android:color/black
                  </item>

                  <item name="android:statusBarColor">
                      @android:color/black
                  </item>

                  <item name="android:navigationBarColor">
                      @android:color/black
                  </item>

              </style>

          </resources>
          EOF

      - name: Verify patches
        run: |
          echo "----- build.gradle.kts -----"
          grep -nE "applicationId|versionCode|versionName" \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo "----- themes.xml -----"
          cat "$PROJECT_DIR/app/src/main/res/values/themes.xml"

          echo "----- fullscreen constant -----"
          grep -n "BEHAVIOR_SHOW" \
            "$PROJECT_DIR/app/src/main/java/com/novagamepad/app/MainActivity.kt"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaGamepad-APK-Day5
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
