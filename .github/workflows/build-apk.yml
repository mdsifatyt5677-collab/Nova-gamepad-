name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NovaGamepad-Day5-assets.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Day-5 project
        run: |
          rm -rf project
          mkdir -p project

          unzip -o NovaGamepad-Day5-assets.zip -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      - name: Find Gradle project
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Fix Day-5 Kotlin source
        run: |
          MAIN="$PROJECT_DIR/app/src/main/java/com/novagamepad/app/MainActivity.kt"
          EDITABLE="$PROJECT_DIR/app/src/main/java/com/novagamepad/app/features/gamepad/components/EditableElement.kt"
          STATE="$PROJECT_DIR/app/src/main/java/com/novagamepad/app/features/gamepad/model/GamepadUiState.kt"

          # Fix AndroidX WindowInsets constant
          sed -i \
            's/BEHAVIOR_SHOW_TRANSIENT_BY_SWIPE_GESTURE/BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE/g' \
            "$MAIN"

          # mutableStateSetOf is inside runtime.snapshots
          sed -i \
            's/import androidx.compose.runtime.mutableStateSetOf/import androidx.compose.runtime.snapshots.mutableStateSetOf/' \
            "$STATE"

          echo "----- GamepadUiState imports -----"
          head -15 "$STATE"

          echo "----- MainActivity WindowInsets -----"
          grep -n "BEHAVIOR_SHOW" "$MAIN" || true

          echo "----- EditableElement -----"
          grep -n "matchParentSize" "$EDITABLE" || true

      - name: Fix Compose dependencies
        run: |
          BUILD="$PROJECT_DIR/app/build.gradle.kts"

          python3 - "$BUILD" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          dependency = '    implementation("androidx.compose.foundation:foundation")'

          if dependency not in s:
              marker = '    implementation("androidx.compose.ui:ui")'
              if marker in s:
                  s = s.replace(
                      marker,
                      marker + "\n" + dependency,
                      1
                  )
              else:
                  raise SystemExit(
                      "Could not find Compose UI dependency in build.gradle.kts"
                  )

          # Day-5 version
          s = s.replace(
              'versionCode = 1',
              'versionCode = 2'
          )

          s = s.replace(
              'versionName = "0.1.0-day1"',
              'versionName = "0.2.0-day5"'
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("Compose foundation dependency added.")
          print("Version changed to 0.2.0-day5.")
          PY

      - name: Create valid Android theme
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/values"

          cat > "$PROJECT_DIR/app/src/main/res/values/themes.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.NovaGamepad"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:windowBackground">
                      @android:color/black
                  </item>

                  <item name="android:statusBarColor">
                      @android:color/black
                  </item>

                  <item name="android:navigationBarColor">
                      @android:color/black
                  </item>

              </style>

          </resources>
          EOF

      - name: Verify source fixes
        run: |
          echo "========================================"
          echo "BUILD PROJECT"
          echo "========================================"

          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Gradle files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f \
            \( -name "settings.gradle.kts" -o -name "build.gradle.kts" \) \
            -print

          echo ""
          echo "Version:"
          grep -n "versionCode\|versionName" \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo ""
          echo "Compose foundation:"
          grep -n "compose.foundation" \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo ""
          echo "mutableStateSetOf import:"
          grep -n "mutableStateSetOf" \
            "$PROJECT_DIR/app/src/main/java/com/novagamepad/app/features/gamepad/model/GamepadUiState.kt"

          echo ""
          echo "WindowInsets constant:"
          grep -n "BEHAVIOR_SHOW" \
            "$PROJECT_DIR/app/src/main/java/com/novagamepad/app/MainActivity.kt"

          echo ""
          echo "Theme:"
          cat "$PROJECT_DIR/app/src/main/res/values/themes.xml"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaGamepad-Day5-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
