name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NovaGamepad-Day5-assets.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Day-5 project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o NovaGamepad-Day5-assets.zip -d project

      - name: Find Gradle project
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix Day-5 Kotlin source
        run: |
          EDITABLE="$PROJECT_DIR/app/src/main/java/com/novagamepad/app/features/gamepad/components/EditableElement.kt"
          STATE="$PROJECT_DIR/app/src/main/java/com/novagamepad/app/features/gamepad/model/GamepadUiState.kt"

          python3 - "$EDITABLE" "$STATE" <<'PY'
          import sys

          editable = sys.argv[1]
          state = sys.argv[2]

          # -----------------------------------------
          # EditableElement.kt
          # -----------------------------------------
          with open(editable, "r", encoding="utf-8") as f:
              s = f.read()

          # matchParentSize is a BoxScope modifier.
          # It is already used inside Box { }, so this import
          # must NOT be present.
          s = s.replace(
              "import androidx.compose.foundation.layout.matchParentSize\n",
              ""
          )

          with open(editable, "w", encoding="utf-8") as f:
              f.write(s)

          # -----------------------------------------
          # GamepadUiState.kt
          # -----------------------------------------
          with open(state, "r", encoding="utf-8") as f:
              s = f.read()

          # Compose BOM 2024.06 uses runtime 1.6.x.
          # mutableStateSetOf was added later, so use
          # mutableStateListOf and prevent duplicates manually.
          s = s.replace(
              "import androidx.compose.runtime.mutableStateSetOf\n",
              "import androidx.compose.runtime.mutableStateListOf\n"
          )

          s = s.replace(
              "private val pressedControls = mutableStateSetOf<GamepadControl>()",
              "private val pressedControls = mutableStateListOf<GamepadControl>()"
          )

          s = s.replace(
              "val pressed: Set<GamepadControl> get() = pressedControls",
              "val pressed: Set<GamepadControl> get() = pressedControls.toSet()"
          )

          s = s.replace(
              "pressedControls.add(control)\n        selected = control",
              """if (control !in pressedControls) {
              pressedControls.add(control)
          }
          selected = control"""
          )

          with open(state, "w", encoding="utf-8") as f:
              f.write(s)

          print("Source fixes applied successfully.")
          PY

      - name: Fix Android fullscreen constant
        run: |
          MAIN="$PROJECT_DIR/app/src/main/java/com/novagamepad/app/MainActivity.kt"

          sed -i \
            's/BEHAVIOR_SHOW_TRANSIENT_BY_SWIPE_GESTURE/BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE/g' \
            "$MAIN"

      - name: Fix app version
        run: |
          BUILD="$PROJECT_DIR/app/build.gradle.kts"

          sed -i 's/versionCode = 1/versionCode = 2/' "$BUILD"
          sed -i 's/versionName = "0.1.0-day1"/versionName = "0.2.0-day5"/' "$BUILD"

      - name: Create valid Android theme
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/values"

          cat > "$PROJECT_DIR/app/src/main/res/values/themes.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.NovaGamepad"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:windowBackground">
                      @android:color/black
                  </item>

                  <item name="android:statusBarColor">
                      @android:color/black
                  </item>

                  <item name="android:navigationBarColor">
                      @android:color/black
                  </item>

              </style>

          </resources>
          EOF

      - name: Verify source fixes
        run: |
          echo "===== EditableElement.kt imports ====="
          sed -n '1,20p' \
            "$PROJECT_DIR/app/src/main/java/com/novagamepad/app/features/gamepad/components/EditableElement.kt"

          echo ""
          echo "===== GamepadUiState.kt imports/state ====="
          sed -n '1,45p' \
            "$PROJECT_DIR/app/src/main/java/com/novagamepad/app/features/gamepad/model/GamepadUiState.kt"

          echo ""
          echo "===== Version ====="
          grep -n "versionCode\|versionName" \
            "$PROJECT_DIR/app/build.gradle.kts"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaGamepad-Day5-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
